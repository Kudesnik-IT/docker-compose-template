# docker/compose.dev.yaml
# Конфигурация для режима разработки
# Добавляет отладочные настройки, автоперезагрузку, расширенные логи

services:
  sample:
    # Перезапуск при изменениях кода (через volume)
    #volumes:
    #  - ../apps/sample/src:/app/src:ro
    # Подключение dev-специфичных переменных (опционально)
    env_file:
      - docker/.env/services/sample.env.dev
    # Отладочные порты (если нужно)
    #ports:
    #  - "{PORT_DEBUG}:8001"  # резервный порт для отладки
    # Режим разработки — не запускать, если остановлен командой
    restart: unless-stopped
    # Дополнительные команды (если нужно)
    # command: python -m http.server 8000 --bind 0.0.0.0 --directory /app
